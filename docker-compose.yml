services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: binnacle
      POSTGRES_PASSWORD: binnacle
      POSTGRES_DB: binnacle
    ports:
      - "5432:5432"
    volumes:
      - binnacle_pgdata:/var/lib/postgresql/data

volumes:
  binnacle_pgdata:
